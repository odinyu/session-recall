# The terminal build: one self-contained binary per platform, attached to the
# same GitHub release the app is published to. This is what the Homebrew formula
# downloads — `releases/latest/download/<stable name>` means the formula never
# needs a version bump, and a formula download is not quarantined, so the CLI and
# the TUI need neither notarization nor an xattr incantation.
name: cli

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the CLI binaries to (e.g. v1.9.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Darwin targets are built ON macOS. Cross-compiling them from Linux
          # embeds a different (85 MB, vs 61 MB) Bun runtime — same source, 39 MB
          # download instead of 27 MB. One macOS runner covers both slices;
          # cross-compiling darwin-x64 from an arm64 Mac gives the right size.
          - os: macos-15
            targets: darwin-arm64 darwin-x64
          - os: ubuntu-latest
            targets: linux-arm64 linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On a tag push this is the tag; on a manual run it must still be the
          # tag named in the input, or the binaries would be built from main and
          # published under an older version's release.
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build ${{ matrix.targets }}
        shell: bash
        run: |
          mkdir -p dist
          for target in ${{ matrix.targets }}; do
            rm -rf dist/pkg && mkdir -p dist/pkg
            bun build src/cli.ts --compile --target=bun-$target --outfile dist/pkg/session-recall
            # The formula runs `bin.install "session-recall"`, so the archive
            # must hold the binary at its top level under that exact name.
            # Plain `tar -czf` defaults to gzip -6 (39 MB); -9 matches the zip.
            # Piped rather than `-I 'gzip -9'`: BSD tar on macOS reads that
            # argument as a program path and fails with "Couldn't open gzip -9".
            tar -cf - -C dist/pkg session-recall | gzip -9 > "dist/session-recall_${target}.tar.gz"
            ls -lh "dist/session-recall_${target}.tar.gz"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: dist/session-recall_*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cli-*
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag: $TAG"
          # The macOS app job creates the release; this one only attaches to it.
          # 80 × 15s covers a slow macOS runner queue.
          for i in $(seq 1 80); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $TAG is up (attempt $i)"
              break
            fi
            echo "waiting for release $TAG (attempt $i)"
            sleep 15
          done
          gh release upload "$TAG" dist/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY"
