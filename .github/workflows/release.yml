name: Release

# Pushing a `v*` tag is the only way to publish a build.
on:
  push:
    tags: ["v*"]

# softprops/action-gh-release creates the release and uploads the assets.
permissions:
  contents: write

jobs:
  macos-app:
    # macos-14's arm64 pool is gone for this repo tier; macos-15 is arm64 and
    # still cross-compiles the Intel slice fine.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      # Both slices: each .app below is single-architecture, so the runner
      # needs the aarch64 target natively and the x86_64 target to
      # cross-compile the Intel sidecar.
      - name: Set up Rust with both Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.12"

      # Fail fast, before a ~15 minute build, if the tag and the manifests disagree.
      - name: Check tag against package version
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)"
          echo "tag=${GITHUB_REF_NAME} package=$version"
          test "${GITHUB_REF_NAME#v}" = "$version" || {
            echo "tag ${GITHUB_REF_NAME} does not match package.json version $version" >&2
            exit 1
          }
          grep -q "^version = \"$version\"$" src-tauri/Cargo.toml || {
            echo "src-tauri/Cargo.toml is not at $version" >&2
            exit 1
          }
          grep -q "\"version\": \"$version\"" src-tauri/tauri.conf.json || {
            echo "src-tauri/tauri.conf.json is not at $version" >&2
            exit 1
          }
          grep -A1 '^name = "session-recall-app"$' src-tauri/Cargo.lock | grep -q "^version = \"$version\"$" || {
            echo "src-tauri/Cargo.lock is not at $version" >&2
            exit 1
          }

      - name: Test
        run: bun test

      # make-app.sh handles the CI-variable trap on purpose: the Tauri CLI binds
      # `CI` to its boolean `--ci` flag, so the script unsets a non-boolean value.
      # Do not call `cargo tauri build` directly here or CI=true would be rejected.
      # One single-architecture bundle per slice; --arch also builds the matching
      # sidecar, so nothing is lipos together.
      #
      # The signing key materializes createUpdaterArtifacts: each build emits
      # `Session Recall.app.tar.gz` + `.sig` beside the .app, which the packaging
      # step turns into the updater's latest.json. An empty password secret is
      # valid: the CLI treats it as a zero-length passphrase.
      - name: Build Apple silicon .app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/make-app.sh --no-install --arch aarch64-apple-darwin

      - name: Build Intel .app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/make-app.sh --no-install --arch x86_64-apple-darwin

      # A GitHub Release cannot carry a directory, so each .app is archived with
      # ditto — which keeps the ad-hoc signature, ACLs and resource forks intact.
      #
      # One zip per architecture, under the stable (version-less) name: the
      # landing page links to /releases/latest/download/session-recall_macos-*.zip,
      # a path that only resolves when the newest release carries exactly those
      # names. A second versioned copy would be the same bytes twice, so the
      # stable name IS the record — the release page shows its tag next to it.
      - name: Package zips and checksums
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          arm="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Session Recall.app"
          intel="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Session Recall.app"
          test -d "$arm"   || { echo "expected bundle missing: $arm" >&2; exit 1; }
          test -d "$intel" || { echo "expected bundle missing: $intel" >&2; exit 1; }
          zip_arm="session-recall_macos-arm64.zip"
          zip_intel="session-recall_macos-intel.zip"
          ditto -c -k --sequesterRsrc --keepParent "$arm" "$zip_arm"
          ditto -c -k --sequesterRsrc --keepParent "$intel" "$zip_intel"
          shasum -a 256 "$zip_arm" > "$zip_arm.sha256"
          shasum -a 256 "$zip_intel" > "$zip_intel.sha256"
          cat "$zip_arm.sha256" "$zip_intel.sha256"
          echo "arm shell:   $(lipo -archs "$arm/Contents/MacOS/session-recall-app")"
          echo "arm sidecar: $(lipo -archs "$arm/Contents/MacOS/session-recall")"
          echo "intel shell:   $(lipo -archs "$intel/Contents/MacOS/session-recall-app")"
          echo "intel sidecar: $(lipo -archs "$intel/Contents/MacOS/session-recall")"

          # Updater artifacts: the signed archives the Rust updater downloads,
          # plus the latest.json it reads to discover them. The .sig files were
          # produced during the builds above (createUpdaterArtifacts + the
          # TAURI_SIGNING_* secrets).
          arm_pkg="$arm.tar.gz"
          intel_pkg="$intel.tar.gz"
          test -f "$arm_pkg"   || { echo "expected updater archive missing: $arm_pkg" >&2; exit 1; }
          test -f "$arm_pkg.sig"   || { echo "expected signature missing: $arm_pkg.sig" >&2; exit 1; }
          test -f "$intel_pkg" || { echo "expected updater archive missing: $intel_pkg" >&2; exit 1; }
          test -f "$intel_pkg.sig" || { echo "expected signature missing: $intel_pkg.sig" >&2; exit 1; }
          up_arm="session-recall_${version}_macos-arm64.app.tar.gz"
          up_intel="session-recall_${version}_macos-intel.app.tar.gz"
          cp "$arm_pkg" "$up_arm"
          cp "$intel_pkg" "$up_intel"

          # Release notes: the 1.7.0 changelog section, verbatim.
          notes="$(awk -v ver="$version" 'index($0, "## " ver " ") { flag = 1; next } /^## / { flag = 0 } flag' CHANGELOG.md)"

          bun scripts/gen-latest-json.mjs \
            --version "$version" \
            --notes "$notes" \
            --sig-arm "$(cat "$arm_pkg.sig")" \
            --url-arm "https://github.com/odinyu/session-recall/releases/download/v${version}/${up_arm}" \
            --sig-intel "$(cat "$intel_pkg.sig")" \
            --url-intel "https://github.com/odinyu/session-recall/releases/download/v${version}/${up_intel}" \
            --out latest.json
          cat latest.json

          {
            echo "version=$version"
            echo "arm_zip=$zip_arm"
            echo "intel_zip=$zip_intel"
            echo "arm_checksum=$(cut -d' ' -f1 < "$zip_arm.sha256")"
            echo "intel_checksum=$(cut -d' ' -f1 < "$zip_intel.sha256")"
            echo "updater_arm=$up_arm"
            echo "updater_intel=$up_intel"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Session Recall ${{ github.ref_name }}
          fail_on_unmatched_files: true
          # Seven assets, no duplicate bytes: two zips + their checksums, the
          # two signed updater archives latest.json points at, and latest.json.
          files: |
            ${{ steps.package.outputs.arm_zip }}
            ${{ steps.package.outputs.arm_zip }}.sha256
            ${{ steps.package.outputs.intel_zip }}
            ${{ steps.package.outputs.intel_zip }}.sha256
            ${{ steps.package.outputs.updater_arm }}
            ${{ steps.package.outputs.updater_intel }}
            latest.json
          body: |
            macOS app for tag `${{ github.ref_name }}` — one single-architecture bundle per slice, ad-hoc signed, **not notarized**.

            | Asset | What it is |
            | --- | --- |
            | `session-recall_macos-arm64.zip` | Apple silicon (M1/M2/M3/M4…), this release (${{ github.ref_name }}) |
            | `session-recall_macos-intel.zip` | Intel Macs, this release (${{ github.ref_name }}) |
            | `….sha256` | SHA-256 checksum for each zip |

            Pick the zip that matches your Mac ( About This Mac says Apple silicon or Intel). Unzip it and move the app to `/Applications`.

            SHA-256 (arm64): `${{ steps.package.outputs.arm_checksum }}`
            SHA-256 (Intel): `${{ steps.package.outputs.intel_checksum }}`

            The build is ad-hoc signed rather than notarized, so macOS quarantines it on the first launch. Clear that flag once:

            ```bash
            unzip session-recall_macos-arm64.zip
            xattr -dr com.apple.quarantine "Session Recall.app"
            open "Session Recall.app"
            ```

            Requires macOS 11 or later. Running from source is also supported — see the README.
