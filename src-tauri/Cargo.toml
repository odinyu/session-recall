[package]
name = "session-recall-app"
version = "1.7.1"
description = "Local, read-only full-text recall across coding-agent sessions."
authors = ["odinyu"]
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Registers the `sessionrecall://` scheme so a brief's link has one stable
# address that opens (or focuses) this app instead of a browser.
tauri-plugin-deep-link = "2"
# System-wide shortcut that summons the window from any app. Registered for the
# whole app, so it also works while the window is hidden in the background.
tauri-plugin-global-shortcut = "2"
# In-app update check against the GitHub release's latest.json. Registration is
# passive; the check itself only runs when prefs allow it.
tauri-plugin-updater = "2"
serde_json = "1"

[profile.release]
# Keep the shell small; the heavy lifting lives in the Bun sidecar.
strip = true
